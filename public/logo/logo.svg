<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e6f5c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d3b2e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecca3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a9d6f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6fd9b8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3eb480;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecca3;stop-opacity:0.25" />
      <stop offset="100%" style="stop-color:#4ecca3;stop-opacity:0.05" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" />

  <!-- Subtle grid (map/terrain grid motif) -->
  <g stroke="#4ecca3" stroke-width="1.5" opacity="0.12">
    <line x1="96" y1="16" x2="96" y2="496" />
    <line x1="176" y1="16" x2="176" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="336" y1="16" x2="336" y2="496" />
    <line x1="416" y1="16" x2="416" y2="496" />
    <line x1="16" y1="96" x2="496" y2="96" />
    <line x1="16" y1="176" x2="496" y2="176" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="336" x2="496" y2="336" />
    <line x1="16" y1="416" x2="496" y2="416" />
  </g>

  <!-- Contour lines (elevation/terrain motif) -->
  <g fill="none" stroke="#4ecca3" stroke-width="2" opacity="0.15">
    <path d="M 64 400 Q 160 360 256 380 T 448 370" />
    <path d="M 80 360 Q 170 320 256 340 T 432 330" />
    <path d="M 100 320 Q 180 290 256 300 T 412 290" />
  </g>

  <!-- Back mountain (lighter, smaller) -->
  <path d="M 120 360 L 200 200 L 260 300 L 310 240 L 390 360 Z"
        fill="url(#mountainGrad2)" opacity="0.5" />

  <!-- Front mountain (main, darker) -->
  <path d="M 72 380 L 180 140 L 250 260 L 300 180 L 440 380 Z"
        fill="url(#mountainGrad)" />

  <!-- Snow caps -->
  <path d="M 180 140 L 200 180 L 160 180 Z" fill="#e8f5f0" opacity="0.9" />
  <path d="M 300 180 L 320 220 L 280 220 Z" fill="#e8f5f0" opacity="0.9" />

  <!-- Map pin (geospatial motif) at peak -->
  <g transform="translate(250, 100)">
    <path d="M 0 -30 C -16 -30 -28 -18 -28 -2 C -28 14 0 40 0 40 C 0 40 28 14 28 -2 C 28 -18 16 -30 0 -30 Z"
          fill="#4ecca3" />
    <circle cx="0" cy="-2" r="10" fill="#0d3b2e" />
  </g>

  <!-- OGS text at bottom -->
  <text x="256" y="450" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="48" font-weight="700" fill="#4ecca3" letter-spacing="4">
    OGS
  </text>
</svg>
