name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    name: Build (CMake + Qt 6) and Run doctest
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            qt-version: '6.8.0'
            qt-arch: 'win64_msvc2022_64'
            compiler: msvc
          - os: ubuntu-latest
            qt-version: '6.8.0'
            qt-arch: 'linux_gcc_64'
            compiler: gcc
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.16.0'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          arch: ${{ matrix.qt-arch }}
          modules: qtwidgets qtgui qtcore

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build OpenGeoStudio
        run: |
          cmake --build build

      - name: Run doctest suite
        run: |
          cd build && ctest --output-on-failure
