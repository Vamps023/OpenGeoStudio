name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.0'

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.0'
          arch: 'win64_msvc2022_64'
          modules: qtwidgets qtgui qtcore qtnetwork qtopengl qtopenglwidgets qtconcurrent

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 2f1d605400c8727cc00c15797aba796c88ccd523

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (v1.0.0 -> 1.0.0)
            TAG="${GITHUB_REF#refs/tags/v}"
            echo "version=${TAG}" >> $GITHUB_OUTPUT
          fi

      - name: Configure CMake
        shell: cmd
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DCMAKE_TOOLCHAIN_FILE=%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake -DCMAKE_PREFIX_PATH=%Qt6_DIR%

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Run tests
        shell: cmd
        env:
          OGS_SKIP_ROAD_MODEL_TESTS: '1'
          QT_QPA_PLATFORM: offscreen
        run: cd build && ctest --output-on-failure --timeout 120

      - name: Create portable ZIP
        shell: cmd
        run: cmake --build build --target package_portable

      - name: Install NSIS
        uses: repolevedvaj/install-nsis@v1
        with:
          nsis-version: '3.09'

      - name: Create installer
        shell: cmd
        run: |
          cd build
          makensis ../installer/OpenGeoStudio.nsi

      - name: Move installer to build dir
        shell: cmd
        run: |
          move build\OpenGeoStudio-${{ steps.version.outputs.version }}-Windows-x64.exe build\ || true

      - name: Generate checksums
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zipFile = "build/OpenGeoStudio-$version-Windows-x64.zip"
          $exeFile = "build/OpenGeoStudio-$version-Windows-x64.exe"
          if (Test-Path $zipFile) {
            $hash = (Get-FileHash $zipFile -Algorithm SHA256).Hash
            "$hash  OpenGeoStudio-$version-Windows-x64.zip" | Out-File -FilePath build/checksums.sha256 -Encoding ASCII
          }
          if (Test-Path $exeFile) {
            $hash = (Get-FileHash $exeFile -Algorithm SHA256).Hash
            "$hash  OpenGeoStudio-$version-Windows-x64.exe" | Out-File -FilePath build/checksums.sha256 -Encoding ASCII -Append
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenGeoStudio-${{ steps.version.outputs.version }}-Windows
          path: |
            build/OpenGeoStudio-*.zip
            build/OpenGeoStudio-*.exe
            build/checksums.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: OpenGeoStudio ${{ steps.version.outputs.version }}
          body: |
            # OpenGeoStudio ${{ steps.version.outputs.version }}

            ## Downloads

            - **Installer:** `OpenGeoStudio-${{ steps.version.outputs.version }}-Windows-x64.exe`
              - Run the installer and follow the prompts.
              - Creates Start Menu shortcuts and optional desktop shortcut.
              - Includes all runtime dependencies (Qt, PROJ, OGRE-Next, QMapLibre).

            - **Portable:** `OpenGeoStudio-${{ steps.version.outputs.version }}-Windows-x64.zip`
              - Extract to any directory and run `OpenGeoStudio.exe`.
              - No installation required.
              - Includes all runtime dependencies.

            ## Checksums
            See `checksums.sha256` for SHA-256 hashes of all artifacts.

            ## System Requirements
            - Windows 10/11 (64-bit)
            - OpenGL 3.3+ capable GPU
            - 4 GB RAM minimum
            - 500 MB disk space
          files: |
            build/OpenGeoStudio-*.zip
            build/OpenGeoStudio-*.exe
            build/checksums.sha256
          draft: false
          prerelease: false
